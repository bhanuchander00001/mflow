<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MFlow</title>
    <!--
      GitHub Pages serves this file for any unknown path (e.g. a hard
      refresh on /privacy). It encodes the requested path into a query
      string and redirects to index.html, which decodes it back via
      history.replaceState before Vue Router boots. See:
      https://github.com/rafgraph/spa-github-pages

      pathSegmentsToKeep = 1 keeps the GitHub Pages project segment
      (the "/mflow" in mflowapp.github.io/mflow/...) intact.
    -->
    <script>
      ;(function (l) {
        var pathSegmentsToKeep = 1
        var newPath =
          l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        l.replace(newPath)
      })(window.location)
    </script>
  </head>
  <body></body>
</html>
